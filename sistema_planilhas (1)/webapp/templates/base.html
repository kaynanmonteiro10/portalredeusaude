<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Sistema de Acompanhamento - Faturamento</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<div class="topo">
  <div class="marca">📊 Sistema de Acompanhamento - Faturamento</div>
  <div class="passos">
    <span class="{{ 'ativo' if passo_atual >= 1 else '' }}">1. Planilha 1</span>
    <span class="{{ 'ativo' if passo_atual >= 2 else '' }}">2. CPF/CNPJ</span>
    <span class="{{ 'ativo' if passo_atual >= 3 else '' }}">3. Tipo Parcela</span>
    <span class="{{ 'ativo' if passo_atual >= 4 else '' }}">4. Planilha 2</span>
    <span class="{{ 'ativo' if passo_atual >= 5 else '' }}">5. Mapeamento</span>
    <span class="{{ 'ativo' if passo_atual >= 6 else '' }}">6. Resultado</span>
  </div>
</div>

<div class="conteudo">
  {% with mensagens = get_flashed_messages() %}
    {% if mensagens %}
      <div class="alerta">
        {% for m in mensagens %}<div>{{ m }}</div>{% endfor %}
      </div>
    {% endif %}
  {% endwith %}

  {% block content %}{% endblock %}
/</div>

</body>
</html>
